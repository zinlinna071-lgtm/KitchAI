name: KitchAI Baseline Checks (WP1.2)

on:
  push:
    branches: [main]
    paths:
      - ".spikes/wp1-1-local-sync/**"
      - ".github/workflows/wp1-1-sync-spike.yml"
      - ".github/workflows/app-shell.yml"
      - "index.html"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "docs/STATUS.md"
      - "docs/WP_REGISTRY.md"
  pull_request:
    paths:
      - ".spikes/wp1-1-local-sync/**"
      - ".github/workflows/wp1-1-sync-spike.yml"

permissions:
  contents: read

concurrency:
  group: wp1-1-sync-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike-tests:
    name: Browser tests and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .spikes/wp1-1-local-sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .spikes/wp1-1-local-sync/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run Chromium browser tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Verify direct dependency tree
        run: npm ls --depth=0

  app-shell:
    name: Application shell checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run app shell tests and build
        run: npm run check
