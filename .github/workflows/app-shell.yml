name: WP1.2 Application Shell
on:
  push:
    branches: [main]
    paths: ["index.html", "src/**", "public/**", "scripts/**", "tests/**", ".spikes/wp1-1-local-sync/app-shell.playwright.config.js", ".spikes/wp1-1-local-sync/tests/app-shell.smoke.spec.js", "package.json", ".github/workflows/app-shell.yml"]
  pull_request:
    paths: ["index.html", "src/**", "public/**", "scripts/**", "tests/**", ".spikes/wp1-1-local-sync/app-shell.playwright.config.js", ".spikes/wp1-1-local-sync/tests/app-shell.smoke.spec.js", "package.json", ".github/workflows/app-shell.yml"]
permissions:
  contents: read
concurrency:
  group: app-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-shell:
    name: Check and build app shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run syntax, type check, unit tests, and production build
        run: npm run check
      - name: Install isolated Chromium test dependencies
        run: npm ci --prefix .spikes/wp1-1-local-sync
      - name: Smoke test responsive layout, install prompt, and offline navigation
        working-directory: .spikes/wp1-1-local-sync
        run: npx playwright test --config app-shell.playwright.config.js
      - name: Upload desktop and mobile UI preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitchai-ui-preview
          path: .spikes/wp1-1-local-sync/artifacts/kitchai-ui-preview-*.png
          if-no-files-found: warn
          retention-days: 7
