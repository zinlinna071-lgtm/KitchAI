name: WP3.5e Stock Count Browser Tests

on:
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "scripts/**"
      - "tests/stock-count-ui.browser.spec.js"
      - "playwright.config.js"
      - ".github/workflows/wp3-5e-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run stock-count browser tests
        run: npx playwright test tests/stock-count-ui.browser.spec.js
