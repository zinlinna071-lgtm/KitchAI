<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="kitchai-base-path" content="__KITCHAI_BASE_PATH__">
<!-- NON-PRODUCTION STATIC PREVIEW: backend config is intentionally empty. -->
<meta name="description" content="KitchAI AI Mode and Manage Mode workspace shell">
<title>KitchAI</title>
<link rel="stylesheet" href="__KITCHAI_BASE_PATH__src/ui-preview.css">
<link rel="stylesheet" href="__KITCHAI_BASE_PATH__src/design-tokens.css">
<link rel="stylesheet" href="__KITCHAI_BASE_PATH__src/ui-components.css">
<script type="module" src="__KITCHAI_BASE_PATH__src/i18n/ui.js"></script>
<script defer src="__KITCHAI_BASE_PATH__src/ui-preview.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
<aside class="sidebar" id="sidebar" aria-label="KitchAI navigation">
<div class="sidebar-top">
<button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" title="Open navigation">☰</button>
<span class="sidebar-brand-name">KitchAI</span>
<button class="icon-button sidebar-minimize" id="sidebar-minimize" aria-label="Minimize navigation" title="Minimize navigation">‹</button>
</div>
<div class="sidebar-content" id="sidebar-content"></div>
<div class="sidebar-bottom"></div>
</aside>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="main-column">
<header class="topbar">
<div class="mode-switch topbar-mode-switch" role="group" aria-label="Choose mode"><button class="mode-button active" data-mode="ai" aria-pressed="true"><span class="mode-icon">✳</span><span>AI Mode</span></button><button class="mode-button" data-mode="manage" aria-pressed="false"><span class="mode-icon">▦</span><span>Manage Mode</span></button></div>
<div class="topbar-actions">
<button class="icon-button compact-theme" id="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">◐</button>
<select id="language-select" aria-label="Interface language"><option value="en">EN</option><option value="my">မြန်မာ</option><option value="th">ไทย</option></select>
</div>
</header>
<main id="main" class="page-shell" tabindex="-1"><div id="page-content"></div></main>
<footer class="footer"><span>KitchAI</span><span>Workspace foundation</span></footer>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
