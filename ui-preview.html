<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="KitchAI AI Mode and Manage Mode interface preview">
<title>KitchAI — UI Preview</title>
<link rel="stylesheet" href="__KITCHAI_BASE_PATH__src/ui-preview.css">
<link rel="stylesheet" href="__KITCHAI_BASE_PATH__src/ui-preview-chat-composer.css">
<script defer src="__KITCHAI_BASE_PATH__src/ui-preview.js"></script>
<script defer src="__KITCHAI_BASE_PATH__src/ui-preview-chat-composer.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
<aside class="sidebar" id="sidebar" aria-label="KitchAI navigation">
<div class="sidebar-top">
<a class="brand" href="#ai" aria-label="KitchAI home"><span class="brand-mark">K</span><span class="brand-name">KitchAI</span></a>
<button class="icon-button sidebar-close" id="sidebar-close" aria-label="Close navigation">×</button>
</div>
<section class="drawer-business-area" aria-label="Business switcher"><div class="drawer-section-label">BUSINESS</div><div id="business-switcher-wrap" class="business-switcher-wrap"><button type="button" class="business-switcher-trigger" id="business-switcher-trigger" aria-expanded="false"><span class="business-switcher-mark">▦</span><span class="business-switcher-copy"><small>Current business</small><b id="business-switcher-name">Night Market</b></span><span class="business-switcher-caret">⌄</span></button><div id="business-switcher-menu" class="business-switcher-menu" hidden></div><div id="business-quick-create-slot" class="business-quick-create-slot"></div></div></section>
<div class="sidebar-content" id="sidebar-content"></div>
<div class="sidebar-bottom">
<div class="sidebar-footnote"><span class="status-dot"></span><span><b>UI Preview</b><small>No live AI or business data</small></span></div>
</div>
</aside>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="main-column">
<header class="topbar">
<button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open navigation">☰</button>
<div class="mode-switch topbar-mode-switch" role="group" aria-label="Choose mode"><button class="mode-button active" data-mode="ai" aria-pressed="true"><span class="mode-icon">✳</span><span>AI Mode</span></button><button class="mode-button" data-mode="manage" aria-pressed="false"><span class="mode-icon">▦</span><span>Manage Mode</span></button></div>
<div class="topbar-actions">
<button class="icon-button compact-theme" id="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">◐</button>
<select id="language-select" aria-label="Interface language"><option value="en">EN</option><option value="my">မြန်မာ</option><option value="th">ไทย</option></select>
<button class="profile-button" id="profile-button" aria-label="User profile" title="User profile">Z</button>
</div>
</header>
<main id="main" tabindex="-1">
<div id="page-content"></div>
</main>
<footer class="footer"><span>KitchAI</span><span>Interface preview · No live business data</span></footer>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
